<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070c18"><link rel="manifest" href="manifest.webmanifest"><title>JOI • AI Command Center</title><style>
*{box-sizing:border-box}body{margin:0;background:#050913;color:#c8f6ff;font-family:system-ui,Arial,sans-serif;overflow:hidden}main{height:100dvh;background:linear-gradient(90deg,#05091355,#05091300 30%,#05091300 70%,#05091355),url('joi.png') center center/contain no-repeat;background-color:#030711;animation:pulse 7s ease-in-out infinite alternate}@keyframes pulse{from{filter:brightness(.88) saturate(.9)}to{filter:brightness(1.14) saturate(1.1)}}.toolbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#061021d9;padding:12px;border:1px solid #4bcbe8;border-radius:20px;box-shadow:0 0 35px #27b5ec55;max-width:95vw}button,a.action{border:1px solid #6cdef5;background:#0a2845;color:#e1fbff;border-radius:12px;padding:13px 17px;font-size:15px;text-decoration:none;cursor:pointer}button:active,a.action:active{background:#14638b}.panel{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:min(92vw,580px);width:100%;background:#061021ed;border:1px solid #4bcbe8;border-radius:14px;padding:15px;box-shadow:0 0 30px #36c4ec55;display:none}.panel.open{display:block}textarea{width:100%;height:80px;border-radius:8px;background:#07182d;color:white;border:1px solid #4bcbe8;padding:10px;font:16px system-ui}small{display:block;opacity:.85;margin:8px 0}#status{position:fixed;top:10px;right:12px;background:#071426cc;padding:6px 10px;border-radius:9px;font-size:12px}@media(max-width:650px){main{background-size:cover;background-position:center}.toolbar{bottom:8px;padding:8px;gap:5px}button,a.action{padding:10px;font-size:13px}}</style></head><body><main aria-label="JOI hologram"></main><div id="status">JOI • Standby</div><section class="panel" id="panel"><strong>JOI • Voice console</strong><small id="msg">Tap Listen to dictate, or type a phrase for JOI to say. This version does not generate AI answers.</small><textarea id="words" placeholder="What should JOI say?"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button id="listen">🎙 Listen</button><button id="speak">🔊 Speak</button><button id="close">Close</button></div></section><nav class="toolbar"><button id="voice">🎙 JOI Voice</button><a class="action" href="https://chatgpt.com/" target="_blank" rel="noopener">✦ Open ChatGPT</a><button id="full">⛶ Full screen</button></nav><script>
const panel=document.getElementById('panel'),msg=document.getElementById('msg'),words=document.getElementById('words'),status=document.getElementById('status');document.getElementById('voice').onclick=()=>panel.classList.toggle('open');document.getElementById('close').onclick=()=>panel.classList.remove('open');document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('speak').onclick=()=>{if(!('speechSynthesis'in window)){msg.textContent='Speech output is unavailable in this browser.';return}const u=new SpeechSynthesisUtterance(words.value||'Good evening. I am Joi.');u.rate=.92;u.pitch=1.08;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.startsWith('en')&&/female|samantha|google us english/i.test(x.name))||vs.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>status.textContent='JOI • Speaking';u.onend=()=>status.textContent='JOI • Standby';speechSynthesis.cancel();speechSynthesis.speak(u)};document.getElementById('listen').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg.textContent='Speech recognition is not supported here. Type text instead.';return}const r=new SR();r.lang='en-US';r.onstart=()=>{status.textContent='JOI • Listening';msg.textContent='Listening…'};r.onresult=e=>{words.value=e.results[0][0].transcript;msg.textContent='Captured. Tap Speak to hear JOI repeat it.'};r.onerror=e=>msg.textContent='Microphone error: '+e.error;r.onend=()=>status.textContent='JOI • Standby';r.start()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body><style>
/* Joi holographic animation */

@keyframes joiFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}

@keyframes joiGlow {
  0%, 100% {
    filter: drop-shadow(0 0 12px #00dfff);
    opacity: 0.92;
  }
  50% {
    filter: drop-shadow(0 0 28px #00dfff);
    opacity: 1;
  }
}

/* Animate Joi's image */
.joi-avatar {
  animation:
    joiFloat 6s ease-in-out infinite,
    joiGlow 4s ease-in-out infinite;
}
@keyframes joiBackgroundFloat {
  0%, 100% {
    background-position: center center, center 50%;
  }
  50% {
    background-position: center center, center 47%;
  }
}

@keyframes joiHologramGlow {
  0%, 100% {
    filter: brightness(0.96) saturate(1);
  }
  50% {
    filter: brightness(1.08) saturate(1.12);
  }
}

main {
  animation: joiBackgroundFloat 6s ease-in-out infinite,
             joiHologramGlow 5s ease-in-out infinite;
}</style></html>
